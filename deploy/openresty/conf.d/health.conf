server {
    listen 80;
    server_name _;
    access_by_lua_block { require("runtime").enforce() }
    location = /runtime/status {
        default_type application/json;
        content_by_lua_block { ngx.say(require("cjson").encode(require("runtime").status())) }
    }
    location = /__orp/status {
        access_log off;
        stub_status;
    }
    location = /runtime/logs {
        default_type application/json;
        content_by_lua_block { require("logs").read() }
    }
    location = /health {
        default_type application/json;
        return 200 '{"status":"UP","service":"orp"}';
    }
    location / {
        default_type text/plain;
        # content_by_lua keeps this development endpoint after access phase,
        # allowing the runtime policy hook to be exercised in Compose.
        content_by_lua_block { ngx.say("orp development node") }
    }
}
