worker_processes auto;
error_log /dev/stderr notice;
pid /var/run/nginx.pid;
env RUNTIME_CONTROL_PLANE_URL;
env RUNTIME_CENTER_ID;
env RUNTIME_POLL_INTERVAL_SECONDS;

events { worker_connections 1024; }

http {
    # Docker's embedded DNS. Production deployments replace this with their
    # internal resolver through the node template.
    resolver 127.0.0.11 ipv6=off valid=10s;
    lua_package_path "/usr/local/openresty/lualib/?.lua;/etc/openresty/lua/?.lua;;";
    lua_package_cpath "/usr/local/openresty/lualib/?.so;;";
    lua_shared_dict runtime_configuration 10m;
    init_worker_by_lua_block { require("runtime").start() }
    include       /usr/local/openresty/nginx/conf/mime.types;
    default_type  application/octet-stream;
    # Keep access logs in the shared demo volume for Filebeat and mirror them
    # to stdout so `docker compose logs` remains useful.
    access_log    /var/log/nginx/access.access.log;
    access_log    /dev/stdout;
    sendfile      on;
    keepalive_timeout 65;
    include /etc/openresty/conf.d/*.conf;
}
