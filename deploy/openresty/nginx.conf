worker_processes auto;
error_log /dev/stderr notice;
pid /var/run/nginx.pid;
env RUNTIME_CONTROL_PLANE_URL;
env RUNTIME_CENTER_ID;
env RUNTIME_POLL_INTERVAL_SECONDS;

events { worker_connections 1024; }

http {
    # Docker's embedded DNS. Production deployments replace this with their
    # internal resolver through the node template.
    resolver 127.0.0.11 ipv6=off valid=10s;
    lua_package_path "/usr/local/openresty/lualib/?.lua;/etc/openresty/lua/?.lua;;";
    lua_package_cpath "/usr/local/openresty/lualib/?.so;;";
    lua_shared_dict runtime_configuration 10m;
    init_worker_by_lua_block { require("runtime").start() }
    include       /usr/local/openresty/nginx/conf/mime.types;
    default_type  application/octet-stream;
    # Emit the same JSON envelope used by published listener configurations so
    # Filebeat can forward bootstrap/demo traffic into the dashboard pipeline.
    log_format orp_http_access escape=json '{"ts":"$time_iso8601","status":$status,"rt":$request_time,"host":"$host","remoteAddr":"$remote_addr","uri":"$request_uri","bytes":$body_bytes_sent,"requestBytes":$request_length}';
    access_log    /var/log/nginx/access.access.log orp_http_access;
    access_log    /dev/stdout orp_http_access;
    sendfile      on;
    keepalive_timeout 65;
    include /etc/openresty/conf.d/*.conf;
}
