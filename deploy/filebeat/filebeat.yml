filebeat.inputs:
  - type: filestream
    id: orp-access
    paths: ["/var/log/nginx/*.access.log"]
    prospector.scanner.check_interval: 1s
    backoff.init: 1s
    backoff.max: 1s
    close.on_state_change.inactive: 1m
    fields_under_root: true
    fields:
      orp_log_type: access
  - type: filestream
    id: orp-error
    paths: ["/var/log/nginx/*.error.log"]
    prospector.scanner.check_interval: 1s
    backoff.init: 1s
    backoff.max: 1s
    close.on_state_change.inactive: 1m
    fields_under_root: true
    fields:
      orp_log_type: error

processors:
  - add_fields:
      target: orp
      fields:
        node_name: ${FILEBEAT_NODE_NAME}
        node_id: ${FILEBEAT_NODE_ID}
  - add_host_metadata: {}

output.kafka:
  hosts: ${FILEBEAT_KAFKA_HOSTS}
  topic: "${FILEBEAT_KAFKA_TOPIC}"
  required_acks: 1
  compression: gzip
  codec.json:
    pretty: false
