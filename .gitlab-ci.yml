workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "beta"'
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-beta\.\d+)?$/'
    - when: never

stages:
  - build
  - release

variables:
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: /certs
  DOCKER_TLS_VERIFY: "1"
  DOCKER_CERT_PATH: /certs/client

build-demo-images:
  stage: build
  image: docker:27.4.1-cli
  services:
    - name: docker:27.4.1-dind
      alias: docker
  before_script:
    - apk add --no-cache git
    - |
      for attempt in $(seq 1 30); do
        docker info >/dev/null 2>&1 && break
        sleep 1
      done
      docker info
    - printf '%s' "$CI_REGISTRY_PASSWORD" | docker login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - |
      publish_image() {
        image=$1
        context=$2
        dockerfile=${3:-Dockerfile}
        docker build --pull -f "$context/$dockerfile" -t "$image:$CI_COMMIT_SHA" "$context"
        docker push "$image:$CI_COMMIT_SHA"
        if [ -n "${CI_COMMIT_TAG:-}" ]; then
          docker tag "$image:$CI_COMMIT_SHA" "$image:$CI_COMMIT_TAG"
          docker push "$image:$CI_COMMIT_TAG"
          case "$CI_COMMIT_TAG" in
            *-beta.*)
              docker tag "$image:$CI_COMMIT_SHA" "$image:beta"
              docker push "$image:beta"
              ;;
            *)
              docker tag "$image:$CI_COMMIT_SHA" "$image:latest"
              docker push "$image:latest"
              ;;
          esac
        elif [ "${CI_COMMIT_BRANCH:-}" = "beta" ]; then
          docker tag "$image:$CI_COMMIT_SHA" "$image:beta"
          docker tag "$image:$CI_COMMIT_SHA" "$image:beta-$CI_COMMIT_SHORT_SHA"
          docker push "$image:beta"
          docker push "$image:beta-$CI_COMMIT_SHORT_SHA"
        fi
      }
      git clone --depth 1 --branch "${ORP_NODE_AGENT_REF:-main}" https://github.com/OpenrestyPilot/orp-node-agent.git deploy/openresty/orp-node-agent
      publish_image "$CI_REGISTRY_IMAGE/openresty" deploy/openresty Dockerfile.control-api
      docker build --pull -f deploy/filebeat/Dockerfile -t "$CI_REGISTRY_IMAGE/filebeat:$CI_COMMIT_SHA" deploy/filebeat
      docker push "$CI_REGISTRY_IMAGE/filebeat:$CI_COMMIT_SHA"
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        docker tag "$CI_REGISTRY_IMAGE/filebeat:$CI_COMMIT_SHA" "$CI_REGISTRY_IMAGE/filebeat:$CI_COMMIT_TAG"
        docker push "$CI_REGISTRY_IMAGE/filebeat:$CI_COMMIT_TAG"
        case "$CI_COMMIT_TAG" in
          *-beta.*)
            docker tag "$CI_REGISTRY_IMAGE/filebeat:$CI_COMMIT_SHA" "$CI_REGISTRY_IMAGE/filebeat:beta"
            docker push "$CI_REGISTRY_IMAGE/filebeat:beta"
            ;;
          *)
            docker tag "$CI_REGISTRY_IMAGE/filebeat:$CI_COMMIT_SHA" "$CI_REGISTRY_IMAGE/filebeat:latest"
            docker push "$CI_REGISTRY_IMAGE/filebeat:latest"
            ;;
        esac
      elif [ "${CI_COMMIT_BRANCH:-}" = "beta" ]; then
        docker tag "$CI_REGISTRY_IMAGE/filebeat:$CI_COMMIT_SHA" "$CI_REGISTRY_IMAGE/filebeat:beta"
        docker tag "$CI_REGISTRY_IMAGE/filebeat:$CI_COMMIT_SHA" "$CI_REGISTRY_IMAGE/filebeat:beta-$CI_COMMIT_SHORT_SHA"
        docker push "$CI_REGISTRY_IMAGE/filebeat:beta"
        docker push "$CI_REGISTRY_IMAGE/filebeat:beta-$CI_COMMIT_SHORT_SHA"
      fi

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  needs: [build-demo-images]
  script:
    - echo "Publishing $CI_COMMIT_TAG quickstart demo images"
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "ORP Quickstart $CI_COMMIT_TAG"
    description: "OpenResty demo image: $CI_REGISTRY_IMAGE/openresty:$CI_COMMIT_TAG\n\nFilebeat demo image: $CI_REGISTRY_IMAGE/filebeat:$CI_COMMIT_TAG"
    assets:
      links:
        - name: Demo container registry
          url: "$CI_PROJECT_URL/container_registry"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-beta\.\d+)?$/'
